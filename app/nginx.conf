server {
    listen 8080;
    server_name localhost;

    # 1. Main Application Assets
    location / {
        root /usr/share/nginx/html;
        index index.html;
    }

    # 2. Liveness Probe
    # Confirms the container is running.
    location /healthz {
        access_log off;
        add_header 'Content-Type' 'text/plain';
        return 200 "OK";
    }

    # 3. Readiness Probe
    # Confirms the server is ready to accept traffic.
    location /readyz {
        access_log off;
        add_header 'Content-Type' 'text/plain';
        return 200 "OK";
    }

}