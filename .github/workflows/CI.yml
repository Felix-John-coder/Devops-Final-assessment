
name: CI Pipeline
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Run ShellCheck
        run: shellcheck -s bash scripts/*.sh

      - name: Run Hadolint
        run: |
          docker run --rm -i hadolint/hadolint:v2.12.0 < app/Dockerfile

  build_image: 
      runs-on: ubuntu-latest 
      timeout-minutes: 1
      outputs:
        tags: ${{ steps.saved.outputs.outputTag }}
      needs: lint
      steps:
        - name: checkout repo 
          uses: actions/checkout@v4 
          with:
            fetch-depth: 0
        
          # we will use this to create a well defined image tag and labels ... good for dynamic tagging
        - name: generate image metadata  
          id: img_tag 
          uses: docker/metadata-action@v5
          with: 
            images: ${{vars.IMAGE_NAME}} 
            tags: |
              type=sha,format=long 
              type=raw,value=latest 
       
          # This build and package the image 
        - name: build time 
          uses: docker/build-push-action@v6 
          with: 
            context: app/
            load: true 
            push: false 
            tags: ${{steps.img_tag.outputs.tags}}
            labels: ${{steps.img_tag.outputs.labels}}
            platforms: linux/amd64 
            build-args: |
              BUILD_SHA=${{github.SHA}}
        
        - name: check built image 
          run: docker images 
        - name: save image  
          id: saved
          run: | 
            image=$( echo "${{steps.img_tag.outputs.tags}}" | grep "sha" | head -n 1)
            echo "outputTag=$image"  >> "$GITHUB_OUTPUT"
            echo "saving now"
            #using .tar will compress the image for faster upload and download(artifact size minimized)
            docker save "$image" -o  image.tar  
        - name: save image tag 
          run: |
            echo "${{steps.img_tag.outputs.tags}}" > image_tag.txt 
        - name: upload image
          uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
          with:
            name: image.tar
            path: .
            retention-days: 7 # for long lasting container increment retention days
            overwrite: true # delete old artifact when new one is uploaded
#=======
#test
#===============

  test:
    runs-on: ubuntu-latest
    needs: build_image
    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: download artifact
        uses: actions/download-artifact@v8
        with:
          name: image.tar
          path: .
      - name: load artifact 
        run: docker load -i image.tar
      - name: run image
        run: |
          docker run -d --name my-nginx-app-test -p 8080:8080 ${{needs.build_image.outputs.tags}}
      - name: check image
        run: |
          docker images
          docker ps
      - name:  test image
        run: |
          chmod +x scripts/*.sh
          ./scripts/sysinfo.sh
          ./scripts/healthcheck.sh