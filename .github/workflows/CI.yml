
name: CI Pipeline
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Run ShellCheck
        run: shellcheck -s bash scripts/*.sh

      - name: Run Hadolint
        run: |
          docker run --rm -i hadolint/hadolint:v2.12.0 < app/Dockerfile

  build_image: 
      runs-on: ubuntu-latest 
      timeout-minutes: 5 
      needs: lint
      steps:
        - name: checkout repo 
          uses: actions/checkout@v4 
          with:
            fetch-depth: 0
        
          # we will use this to create a well defined image tag and labels ... good for dynamic tagging
        - name: generate image metadata  
          id: img_tag 
          uses: docker/metadata-action@v5
          with: 
            images: ${{vars.IMAGE_NAME}} 
            tags: |
              type=sha,prefix=${{github.sha}}
              type=raw,value=latest 
        - name:  check directory
          run: pwd 
          # This build and package the image 
        - name: build time 
          uses: docker/build-push-action@v6 
          with: 
            context: app/
            load: true 
            push: false 
            tags: ${{steps.img_tag.outputs.tags}}
            labels: ${{steps.img_tag.outputs.labels}}
            platforms: linux/amd64 
        
        - name: check built image 
          run: docker images 
        - name: save image  
          id: saved
          run: | 
            image=$( echo "${{steps.img_tag.outputs.tags}}" )
            echo "saving now"
            #using .tar will compress the image for faster upload and download(artifact size minimized)
            docker save "$image" -o  image.tar  
        - name: save image tag 
          run: |
            echo "${{steps.img_tag.outputs.tags}}" > image_tag.txt 
    

